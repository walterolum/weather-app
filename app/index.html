<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkySense – Real‑Time Weather Dashboard</title>
  <meta name="description" content="A sleek, glass‑morphism weather app that provides real‑time forecasts for any city using the OpenWeatherMap API." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>SkySense</h1>
      <p class="tagline">Your personal weather companion</p>
    </header>
    <section class="search-section">
      <input type="text" id="city-input" placeholder="Enter city (e.g., London)" />
      <button id="search-btn">Get Weather</button>
    </section>
    <section class="weather-result" id="weather-result" hidden>
      <div class="location">
        <h2 id="city-name"></h2>
        <p id="date"></p>
      </div>
      <div class="temp">
        <img id="weather-icon" src="" alt="Weather icon" />
        <span id="temperature"></span>
        <span class="unit">°C</span>
      </div>
      <div class="details">
        <p>Feels like: <span id="feels-like"></span>°C</p>
        <p>Humidity: <span id="humidity"></span>%</p>
        <p>Wind: <span id="wind"></span> m/s</p>
      </div>
    </section>
    <footer class="footer">
      <p>Data provided by <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a></p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
